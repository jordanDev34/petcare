<ng-container *ngIf="vm$ | async as vm">
  <div class="min-h-screen bg-slate-50 flex items-center justify-center p-6">
    <div class="w-full max-w-lg rounded-2xl bg-white shadow p-6">
      <div class="flex items-start justify-between gap-4">
        <div>
          <h1 class="text-2xl font-bold">🐾 PetCare</h1>
          <p class="mt-1 text-slate-600">Test de connexion Front ↔ Back</p>
        </div>

        <span
          class="inline-flex items-center rounded-full px-3 py-1 text-sm font-semibold"
          [class.bg-emerald-100]="vm.data?.status === 'UP' && !vm.loading"
          [class.text-emerald-800]="vm.data?.status === 'UP' && !vm.loading"
          [class.bg-rose-100]="!!vm.error"
          [class.text-rose-800]="!!vm.error"
          [class.bg-slate-100]="vm.loading"
          [class.text-slate-700]="vm.loading"
        >
          <ng-container *ngIf="vm.loading">Loading…</ng-container>
          <ng-container *ngIf="!vm.loading && vm.data">{{ vm.data.status }}</ng-container>
          <ng-container *ngIf="!vm.loading && vm.error">DOWN</ng-container>
        </span>
      </div>

      <div class="mt-6 rounded-xl border border-slate-200 p-4">
        <div class="text-sm text-slate-500">Service</div>
        <div class="mt-1 font-mono text-slate-900">
          <ng-container *ngIf="vm.data; else emptyService">{{ vm.data.service }}</ng-container>
          <ng-template #emptyService>—</ng-template>
        </div>

        <div class="mt-4 text-sm text-slate-500">Timestamp</div>
        <div class="mt-1 font-mono text-slate-900">
          <ng-container *ngIf="vm.data; else emptyTs">{{ vm.data.timestamp }}</ng-container>
          <ng-template #emptyTs>—</ng-template>
        </div>

        <div *ngIf="vm.error" class="mt-4 text-sm text-rose-700">
          {{ vm.error }}
        </div>
      </div>

      <button
        type="button"
        (click)="refresh()"
        class="mt-6 w-full rounded-xl bg-black text-white py-2 font-semibold hover:opacity-90 disabled:opacity-50"
        [disabled]="vm.loading"
      >
        Retester l’API
      </button>

      <p class="mt-4 text-xs text-slate-500">
        Proxy dev : <span class="font-mono">/api/*</span> → <span class="font-mono">localhost:8080</span>
      </p>
    </div>
  </div>
</ng-container>
