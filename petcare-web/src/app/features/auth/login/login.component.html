<div class="min-h-[calc(100vh-4rem)] flex items-center justify-center p-6">
  <div class="w-full max-w-md bg-white rounded-2xl shadow p-6">
    <h1 class="text-2xl font-bold mb-2">Connexion</h1>
    <p class="text-sm text-slate-600 mb-6">
      Connectez-vous pour accéder à votre espace PetCare.
    </p>

    <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-4">
      <div>
        <label class="block text-sm text-slate-700 mb-1">Email</label>
        <input
          type="email"
          formControlName="email"
          class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-slate-900"
          placeholder="vous@example.com"
        />
        @if (form.controls.email.touched && form.controls.email.invalid) {
          <p class="mt-1 text-xs text-rose-600">Email invalide.</p>
        }
      </div>

      <div>
        <label class="block text-sm text-slate-700 mb-1">Mot de passe</label>
        <input
          type="password"
          formControlName="password"
          class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-slate-900"
          placeholder="••••••••"
        />
        @if (form.controls.password.touched && form.controls.password.invalid) {
          <p class="mt-1 text-xs text-rose-600">Mot de passe requis.</p>
        }
      </div>

      @if (error) {
        <p class="text-sm text-rose-600">{{ error }}</p>
      }

      <button
        type="submit"
        class="w-full mt-2 rounded-lg bg-black text-white py-2 text-sm font-semibold hover:opacity-90 disabled:opacity-50"
        [disabled]="loading"
      >
        @if (loading) {
          Connexion…
        } @else {
          Se connecter
        }
      </button>
    </form>
  </div>
</div>
